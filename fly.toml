# The public demo at https://javadropbox.mevcaus.dev, on Fly.io. GitHub Actions
# deploys it after CI passes on main (.github/workflows/deploy-demo.yml).
#
# One-time setup, should it ever need doing again:
#   fly apps create javadropbox
#   fly volumes create javadropbox_data --region sjc --size 1 -a javadropbox
#   fly secrets import -a javadropbox --stage
#     SPRING_DATASOURCE_URL=jdbc:postgresql://<neon host>/neondb?sslmode=require
#     SPRING_DATASOURCE_USERNAME=... and SPRING_DATASOURCE_PASSWORD=..., one per
#     line, then Ctrl-D. Neon's direct host, not the pooled one: Flyway's lock
#     needs a session of its own.
#   fly tokens create deploy -a javadropbox | gh secret set FLY_API_TOKEN
#   fly ips allocate-v4 --shared -a javadropbox && fly ips allocate-v6 -a javadropbox
#   fly certs add javadropbox.mevcaus.dev -a javadropbox
# then A and AAAA records for javadropbox.mevcaus.dev pointing at those IPs,
# DNS only (not proxied by Cloudflare), so Fly can issue the certificate.

app = "javadropbox"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  # Shared account, nightly reset and small limits: src/main/resources/application-demo.properties.
  SPRING_PROFILES_ACTIVE = "demo"
  # A folder on the volume rather than the volume itself, whose root holds the filesystem's own
  # lost+found: the app would list it, and the daily reset could not delete it.
  JAVADROPBOX_SERVING_DIRECTORY = "/data/files"
  # Fits the JVM into the machine's 512 MB with room to spare for its own overhead.
  JAVA_TOOL_OPTIONS = "-XX:+UseSerialGC -Xmx256m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1"
  # Requests arrive through Fly's proxy, which connects from 172.16.0.0/12. Trusting it (and only
  # it) for X-Forwarded-For/-Proto gives the sign-in throttle each visitor's own address and
  # share links their https URL.
  SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES = '172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}'

[http_service]
  internal_port = 8080
  force_https = true
  # Suspended while nobody is using it, which costs next to nothing, and resumed in about a second
  # by the next request. DemoService resets the files on that request if the reset time has passed.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    # Not /actuator/health, which queries the database and would keep a connection from ever
    # going idle (see application-demo.properties).
    path = "/actuator/health/liveness"

# Stored files and their versions (the volume is created in the setup above).
[mounts]
  source = "javadropbox_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
