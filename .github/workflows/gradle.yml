# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A new push to a pull request cancels its run still in progress. Pushes to main
# get a group per commit, so none is cancelled or left waiting behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    # build runs the tests (the H2 suite and the Postgres ones through Testcontainers,
    # which uses the runner's Docker) and the Spotless check.
    - name: Build with Gradle Wrapper
      run: ./gradlew build

  docker:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The image bundles the frontend, whose logos are LFS objects.
        lfs: true

    # Runs the stack as the README tells users to. --wait returns once both
    # services pass their healthchecks, and fails if either never does.
    - name: Start the app with Docker Compose
      run: docker compose --profile app up --build --detach --wait --wait-timeout 180

    # The healthcheck only proves the app and its database are up. Check that / (which
    # redirects to the setup page on a fresh install) serves the built app
    # shell, and that the script it loads is in the jar too.
    - name: Check the app serves the frontend
      run: |
        shell=$(curl -fsSL http://localhost:8080/)
        grep -q '<div id="root">' <<< "$shell"
        script=$(grep -o '/assets/[^"]*\.js' <<< "$shell" | head -n 1)
        test -n "$script"
        curl -fsS -o /dev/null "http://localhost:8080$script"

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22.12'
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Install the end-to-end tests
      working-directory: e2e
      run: |
        npm ci
        npx playwright install --with-deps chromium

    # Drives the running stack in Chromium: first-run setup with the code from the app's
    # log, then sign-in, uploads, previews, downloads, share links, versions and deletes.
    - name: Run the end-to-end tests
      working-directory: e2e
      run: npm test

    # The HTML report holds a trace and a screenshot of every failed test.
    - name: Upload the Playwright report
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-report
        path: e2e/playwright-report
        retention-days: 14

    - name: Show the logs
      if: failure()
      run: docker compose --profile app logs

    - name: Stop the app
      if: always()
      run: docker compose --profile app down --volumes

  dependency-submission:

    # Submitting the graph needs contents: write, which pull requests from forks
    # never get, and only main's dependencies matter for Dependabot alerts.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 21
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        java-version: '21'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
