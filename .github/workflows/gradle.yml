# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A new push to a pull request cancels its run still in progress. Pushes to main
# get a group per commit, so none is cancelled or left waiting behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 21
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '21'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    # build runs the tests (on PostgreSQL through Testcontainers, which uses the
    # runner's Docker), the coverage minimums and the Spotless check.
    - name: Build with Gradle Wrapper
      run: ./gradlew build

    # The report is written before the minimums are checked, so it is there when they fail.
    - name: Summarize coverage
      # Reporting only: a failure here shows as a warning, not a red check that blocks merges.
      continue-on-error: true
      if: ${{ !cancelled() && hashFiles('build/reports/jacoco/test/jacocoTestReport.xml') != '' }}
      run: python3 .github/scripts/coverage.py jacoco build/reports/jacoco/test/jacocoTestReport.xml --name Backend --badge "$RUNNER_TEMP/backend.json" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the coverage report
      continue-on-error: true
      if: ${{ !cancelled() && hashFiles('build/reports/jacoco/test/jacocoTestReport.xml') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: backend-coverage
        path: build/reports/jacoco/test
        retention-days: 14

    # For the Coverage badges workflow, which runs once this one passes.
    - name: Keep the badge
      continue-on-error: true
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: backend-coverage-badge
        path: ${{ runner.temp }}/backend.json
        retention-days: 1

  docker:

    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      trivy-sarif: ${{ steps.sarif.outcome == 'success' }}
      zap-sarif: ${{ steps.zap-sarif.outcome == 'success' }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The image bundles the frontend, whose logos are LFS objects.
        lfs: true

    # Runs the stack as the README tells users to. --wait returns once both
    # services pass their healthchecks, and fails if either never does.
    - name: Start the app with Docker Compose
      id: stack
      run: docker compose --profile app up --build --detach --wait --wait-timeout 180

    # The healthcheck only proves the app and its database are up. Check that / (which
    # redirects to the setup page on a fresh install) serves the built app
    # shell, and that the script it loads is in the jar too.
    - name: Check the app serves the frontend
      run: |
        shell=$(curl -fsSL http://localhost:8080/)
        grep -q '<div id="root">' <<< "$shell"
        script=$(grep -o '/assets/[^"]*\.js' <<< "$shell" | head -n 1)
        test -n "$script"
        curl -fsS -o /dev/null "http://localhost:8080$script"

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.22.2'
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Install the end-to-end tests
      working-directory: e2e
      run: |
        npm ci
        npx playwright install chromium

    # Drives the running stack in Chromium: first-run setup with the code from the app's
    # log, then sign-in, uploads, previews, downloads, share links, versions and deletes.
    - name: Run the end-to-end tests
      working-directory: e2e
      run: npm test

    # The HTML report holds a trace and a screenshot of every failed test.
    - name: Upload the Playwright report
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report
        path: e2e/playwright-report
        retention-days: 14

    - name: Show the logs
      if: failure()
      run: docker compose --profile app logs

    # ZAP's baseline scan of the running app, even if an end-to-end test failed: it crawls the app
    # from inside the stack's network, requests the routes open without a session, and checks the
    # responses with its passive rules, without attacking anything. The plan, and the alerts it
    # accepts with why, is .github/zap/baseline.yaml. ZAP is the image pinned in
    # .github/zap/Dockerfile, with the add-ons pinned in .github/zap/addons.txt.
    - name: Scan the running app with ZAP
      id: zap
      if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
      timeout-minutes: 10
      run: |
        rc=0
        .github/scripts/zap-scan.sh "$RUNNER_TEMP/zap" || rc=$?
        if [ -f "$RUNNER_TEMP/zap/code-scanning.sarif" ]; then
          echo "sarif=true" >> "$GITHUB_OUTPUT"
        fi
        if [ "$rc" = 2 ]; then
          echo "::error::ZAP raised an alert that .github/zap/baseline.yaml doesn't accept. See the ALERT lines above and docs/testing.md#running-app-scan."
        elif [ "$rc" != 0 ]; then
          echo "::error::ZAP couldn't scan the app as .github/zap/baseline.yaml says (exit $rc). See its log above."
        fi
        exit "$rc"

    # Reporting only, like the Trivy results below.
    - name: Keep the ZAP results
      id: zap-sarif
      if: ${{ !cancelled() && steps.zap.outputs.sarif == 'true' }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: zap-results
        path: |
          ${{ runner.temp }}/zap/code-scanning.sarif
          ${{ runner.temp }}/zap/zap.html
        retention-days: 14

    - name: Stop the app
      if: always()
      run: docker compose --profile app down --volumes

    # The same image again, with search on Elasticsearch as docs/self-hosting.md sets it up
    # (compose's elasticsearch profile), and the end-to-end tests again on it, search among them.
    - name: Start the app with search on Elasticsearch
      id: elasticsearch
      if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
      env:
        COMPOSE_PROFILES: app,elasticsearch
        JAVADROPBOX_SEARCH_BACKEND: elasticsearch
      run: |
        docker compose up --detach --wait --wait-timeout 300
        docker compose logs --no-color app | grep -q 'Search uses the Elasticsearch index javadropbox at http://elasticsearch:9200'

    - name: Run the end-to-end tests on Elasticsearch
      if: ${{ !cancelled() && steps.elasticsearch.outcome == 'success' }}
      working-directory: e2e
      run: npm test

    - name: Upload the Playwright report on Elasticsearch
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-report-elasticsearch
        path: e2e/playwright-report
        retention-days: 14

    - name: Show the logs on Elasticsearch
      if: failure()
      run: docker compose --profile app --profile elasticsearch logs

    - name: Stop the app on Elasticsearch
      if: always()
      run: docker compose --profile app --profile elasticsearch down --volumes

    # Known vulnerabilities in the image the steps above ran, after the end-to-end tests so a finding
    # doesn't hide whether they pass, and after the stack is down (the image stays) so nothing Trivy
    # runs can reach it. Trivy runs from its own image (.github/trivy/Dockerfile, pinned by digest,
    # which Dependabot keeps current) on a saved copy of ours, with a folder of its own mounted: no
    # Docker socket, no token, and none of the runner's files.
    - name: Save the image for Trivy
      id: image
      if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
      run: |
        mkdir "$RUNNER_TEMP/trivy"
        image="$(docker compose --profile app config --format json | jq -r .name)-app"
        docker save "$image" -o "$RUNNER_TEMP/trivy/image.tar"

    # Every finding as SARIF for the Security tab (the security-results job uploads it), the accepted ones
    # included so they stay in sight. Then the gate: a fixable high or critical vulnerability not in
    # .trivyignore fails the build, scanned offline against the database the first pass fetched.
    # Trivy exits 1 when it fails itself, so the gate uses 2 to tell a finding from an error.
    - name: Scan the image with Trivy
      id: trivy
      if: ${{ !cancelled() && steps.image.outcome == 'success' }}
      timeout-minutes: 10
      run: |
        image=$(sed -n 's/^FROM //p' .github/trivy/Dockerfile)
        flags=(image --input /work/image.tar --scanners vuln --cache-dir /work/cache
          --disable-telemetry --skip-version-check --no-progress)
        docker run --rm -v "$RUNNER_TEMP/trivy:/work" "$image" "${flags[@]}" --format sarif --output /work/trivy.sarif || {
          echo "::error::Trivy couldn't scan the image, often because its database couldn't be fetched. See its log above."
          exit 1
        }
        echo "sarif=true" >> "$GITHUB_OUTPUT"
        rc=0
        docker run --rm --network none -v "$RUNNER_TEMP/trivy:/work" -v "$PWD/.trivyignore:/trivyignore:ro" "$image" \
          "${flags[@]}" --ignorefile /trivyignore --skip-db-update --skip-java-db-update \
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 2 || rc=$?
        if [ "$rc" = 2 ]; then
          echo "::error::Trivy found a fixable high or critical vulnerability in the image. See the table above and docs/testing.md#image-vulnerability-scan."
        elif [ "$rc" != 0 ]; then
          echo "::error::Trivy failed (exit $rc) before it could check the image. See its log above."
        fi
        exit "$rc"

    # Reporting only, like the security-results job: a blip in the artifact service shouldn't fail
    # this check. That job then skips Trivy's results, since this step's outcome is the trivy-sarif output.
    - name: Keep the Trivy results
      id: sarif
      if: ${{ !cancelled() && steps.trivy.outputs.sarif == 'true' }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: trivy-sarif
        path: ${{ runner.temp }}/trivy/trivy.sarif
        retention-days: 1

  # Puts Trivy's and ZAP's results under the Security tab. A job of its own, so the token that can
  # write them never reaches the job that builds the image and runs its tests. Reporting only: if
  # it fails, the workflow still passes, since the demo's deploy and the coverage badges wait on it.
  security-results:

    needs: docker
    # Also when a scan failed the build, as long as it got as far as writing its results.
    if: ${{ !cancelled() && (needs.docker.outputs.trivy-sarif == 'true' || needs.docker.outputs.zap-sarif == 'true') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    # The uploads read the commit and ref from the checkout.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Each tool's results are uploaded even when the other's failed.
    - name: Download Trivy's results
      id: trivy-download
      if: ${{ needs.docker.outputs.trivy-sarif == 'true' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: trivy-sarif
        path: ${{ runner.temp }}/trivy

    - name: Upload Trivy's results
      if: ${{ steps.trivy-download.outcome == 'success' }}
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ runner.temp }}/trivy/trivy.sarif
        category: trivy

    - name: Download ZAP's results
      id: zap-download
      if: ${{ !cancelled() && needs.docker.outputs.zap-sarif == 'true' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: zap-results
        path: ${{ runner.temp }}/zap

    - name: Upload ZAP's results
      if: ${{ !cancelled() && steps.zap-download.outcome == 'success' }}
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        sarif_file: ${{ runner.temp }}/zap/code-scanning.sarif
        category: zap

  dependency-submission:

    # Submitting the graph needs contents: write, which pull requests from forks
    # never get, and only main's dependencies matter for Dependabot alerts.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up JDK 21
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '21'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
