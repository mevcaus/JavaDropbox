# Static analysis with CodeQL. Its results show under the Security tab, and on a pull request as
# annotations on the lines it changed.

name: CodeQL

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Weekly as well, so new queries run on code that hasn't changed.
  schedule:
    - cron: '27 6 * * 1'

# A new push to a pull request cancels its run still in progress. Pushes to main
# get a group per commit, so none is cancelled or left waiting behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})

    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To upload the results.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # java-kotlin: the backend. javascript-typescript: the frontend and the end-to-end tests.
        # actions: these workflows, for injection and token permission mistakes.
        language: [ java-kotlin, javascript-typescript, actions ]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # build-mode none for all three: CodeQL reads the Java sources without compiling them, so the
    # job needs no JDK or Gradle, and nothing in the backend is generated at build time.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ matrix.language }}
        build-mode: none

    - name: Analyze
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: /language:${{ matrix.language }}
