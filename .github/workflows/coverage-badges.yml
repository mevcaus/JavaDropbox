# Updates the README's coverage badges once CI has passed on main. A workflow of its own, so the
# demo's deploy and the CI badges never wait on it or fail with it, and the token that can push
# never reaches a job that runs the build and its dependencies.

name: Coverage badges

on:
  workflow_run:
    workflows: [ "Java CI with Gradle", "Frontend CI" ]
    types: [ completed ]
    branches: [ "main" ]

jobs:
  publish:

    # Only pushes to main: pull requests run the same CI workflows, and their branches can be named
    # main too when they come from forks.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      # To push the badges branch, and to read the CI run's artifacts.
      contents: write
      actions: read

    env:
      BADGE: ${{ github.event.workflow_run.name == 'Frontend CI' && 'frontend' || 'backend' }}

    steps:
    # main as it is now, for the script; the badge comes from the run that triggered this one.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ env.BADGE }}-coverage-badge
        path: ${{ runner.temp }}/badge
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ github.token }}

    # Runs for each commit on main can finish in any order, so the script leaves the badge alone
    # once main has moved past the commit it was measured on; that commit's run publishes instead.
    - name: Publish the badge
      env:
        MEASURED_SHA: ${{ github.event.workflow_run.head_sha }}
      run: .github/scripts/publish-badge.sh "$RUNNER_TEMP/badge/$BADGE.json"
