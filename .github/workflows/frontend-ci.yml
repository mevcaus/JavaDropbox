name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4

    # Vite 7 and Vitest 5 only run on Node 20.19+ or 22.12+. Pin the floor here so
    # CI fails on the version line rather than on a confusing missing-export error.
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.12'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    # Split from the test step so a red build says which of the three failed.
    - name: Lint
      run: npm run lint

    - name: Test
      run: npm test

    # The suite runs in jsdom and would not catch a broken production bundle.
    - name: Build
      run: npm run build
