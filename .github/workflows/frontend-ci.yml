name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A new push to a pull request cancels its run still in progress. Pushes to main
# get a group per commit, so none is cancelled or left waiting behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The logo assets are stored in lfs. Without this the checkout leaves
        # 130-byte pointer files in their place, which still build successfully
        # and ship a bundle with every logo broken.
        lfs: true

    # jsdom and its undici need Node 22.22.2+ (undici calls zlib.createZstdDecompress,
    # which Node 22.12 lacks). Pin the floor from engines here so CI fails on the
    # version line rather than on a confusing missing-export error.
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.22.2'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    # Split from the other steps so a red build says which one failed.
    - name: Lint
      run: npm run lint

    # Vite and Vitest only strip types, so this is the step that fails on a type error.
    - name: Type check
      run: npm run typecheck

    # The backend build fails when openapi.json no longer matches the controllers
    # (OpenApiSpecTests); this fails when the types were not generated again from it.
    - name: API types up to date
      run: |
        npm run api:types
        git diff --exit-code -- src/services/apiSchema.ts || {
          echo "::error file=frontend/src/services/apiSchema.ts::Out of date with frontend/openapi.json. Run npm run api:types in frontend/ and commit the result."
          exit 1
        }

    # Fails when coverage drops below the thresholds in vite.config.js.
    - name: Test
      run: npm test -- --coverage

    # Vitest writes the report before checking the thresholds, so it is there when they fail.
    - name: Summarize coverage
      if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
      run: python3 ../.github/scripts/coverage.py vitest coverage/coverage-summary.json --name Frontend --badge "$RUNNER_TEMP/frontend.json" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the coverage report
      if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: frontend-coverage
        path: frontend/coverage
        retention-days: 14

    # For the Coverage badges workflow, which runs once this one passes.
    - name: Keep the badge
      if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: frontend-coverage-badge
        path: ${{ runner.temp }}/frontend.json
        retention-days: 1

    # The suite runs in jsdom and would not catch a broken production bundle.
    - name: Build
      run: npm run build
