name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A new push to a pull request cancels its run still in progress. Pushes to main
# get a group per commit, so none is cancelled or left waiting behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The logo assets are stored in lfs. Without this the checkout leaves
        # 130-byte pointer files in their place, which still build successfully
        # and ship a bundle with every logo broken.
        lfs: true

    # Vite 7 and Vitest 5 only run on Node 20.19+ or 22.12+. Pin the floor here so
    # CI fails on the version line rather than on a confusing missing-export error.
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22.12'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    # Split from the test step so a red build says which of the three failed.
    - name: Lint
      run: npm run lint

    - name: Test
      run: npm test

    # The suite runs in jsdom and would not catch a broken production bundle.
    - name: Build
      run: npm run build
