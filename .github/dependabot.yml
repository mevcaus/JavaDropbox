version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current, version
  # comments included.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # The Trivy image the docker job scans with (.github/trivy/Dockerfile).
  - package-ecosystem: "docker"
    directory: "/.github/trivy"
    schedule:
      interval: "weekly"

  # The frontend, the end-to-end tests and the root start script. Minor and
  # patch updates come as one weekly PR; a major (Tailwind 4, say) gets a PR of
  # its own.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/frontend"
      - "/e2e"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        # Its own PR: a new version can change the generated API types, and
        # that PR then needs npm run api:types committed (docs/development.md).
        exclude-patterns: ["openapi-typescript"]
      # A major of Vitest in one PR with its coverage provider, which takes only
      # the exact same Vitest version as a peer and fails npm ci otherwise.
      vitest:
        patterns: ["vitest", "@vitest/*"]
    ignore:
      # Pinned to 5.x: openapi-typescript needs typescript ^5.x as a peer, and
      # typescript-eslint takes nothing past 6.0. TypeScript 7, the native
      # compiler, has no JavaScript API for either. Lift this once both accept
      # a newer major.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
