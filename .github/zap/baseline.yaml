# ZAP's baseline scan of the running app, as an automation plan: crawl it, request the routes open to
# visitors who aren't signed in, wait for the passive scan rules to check what came back, and write
# the reports. Nothing is attacked. .github/scripts/zap-scan.sh runs it, as does the docker job in
# .github/workflows/gradle.yml after the end-to-end tests, and fails on any alert this plan doesn't
# accept (docs/testing.md#running-app-scan).
env:
  contexts:
    - name: app
      urls:
        - http://app:8080
  parameters:
    failOnError: true
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      maxAlertsPerRule: 10
      enableTags: false

  # The alerts the build accepts, each with why, marked false positives so they leave the reports.
  # Scoped to where the reason holds where it doesn't hold everywhere: a new alert of the same kind
  # anywhere else still fails the build.
  - type: alertFilter
    alertFilters:
      # The app is a single-page app, so ZAP's crawler finds no links in its pages. It says so, and
      # that is all this alert means.
      - ruleId: 10109
        newRisk: False Positive
      # No Content-Security-Policy yet. Accepted until #401, which adds one.
      - ruleId: 10038
        newRisk: False Positive
      # No Cross-Origin-Embedder-, Opener- or Resource-Policy yet. Accepted until #401, which adds
      # them with the Content-Security-Policy.
      - ruleId: 90004
        newRisk: False Positive
      # XSRF-TOKEN has to be readable by the app's script, which sends it back in a header. That is
      # how Spring Security's cookie CSRF protection works, and the cookie holds no session.
      - ruleId: 10010
        newRisk: False Positive
        parameter: XSRF-TOKEN
      # ZAP notes that XSRF-TOKEN could hold a session. It doesn't.
      - ruleId: 10112
        newRisk: False Positive
        parameter: XSRF-TOKEN
      # Words like "admin" or "select" in the minified bundle: route names and library code, not
      # comments left in by mistake.
      - ruleId: 10027
        newRisk: False Positive
        url: http://app:8080/assets/.*\.js
        urlRegex: true
      # Spring Security sends Cache-Control: no-store on every response, so nothing a signed-in user
      # saw stays in a cache. Only that variant of the rule: content a cache could keep still fails.
      - ruleId: 10049
        newRisk: False Positive
        evidence: no-store

  - type: spider
    parameters:
      url: http://app:8080
      maxDuration: 1

  # The crawler only finds the pages the app shell links to, so these are requested directly: the
  # routes SecurityConfig lets through without a session, with made-up tokens. Their 401s, 404s and
  # errors carry the same headers as their real answers.
  - type: requestor
    requests:
      - url: http://app:8080/login
      - url: http://app:8080/api/me
      - url: http://app:8080/api/files
      - url: http://app:8080/share/zap-not-a-token
      - url: http://app:8080/share/zap-not-a-token/info
      - url: http://app:8080/share/zap-not-a-token/download
      - url: http://app:8080/share/zap-not-a-token/preview
      - url: http://app:8080/api/invite/zap-not-a-token
      - url: http://app:8080/api/reset-password/zap-not-a-token
      - url: http://app:8080/actuator/health
      - url: http://app:8080/v3/api-docs

  - type: passiveScan-wait
    parameters:
      maxDuration: 5

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk
      reportFile: zap.html
      reportTitle: ZAP baseline scan

  - type: report
    parameters:
      template: sarif-json
      reportDir: /zap/wrk
      reportFile: zap.sarif
      reportTitle: ZAP baseline scan

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap.json
      reportTitle: ZAP baseline scan
