spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# The migrations are Postgres SQL, so the H2 tests keep generating their schema
# from the entities. Tests that run on a real Postgres container turn Flyway
# back on and switch Hibernate to validate, like production.
spring.flyway.enabled=false
# Tests that touch files point this at their own temporary directory.
javadropbox.serving.directory=build/test-storage
# A search index for each test context, outside the serving directory: contexts
# that share one would contend for its lock, and a test's temporary directory
# could not be deleted while the indexer was still writing into it.
javadropbox.search.index-directory=build/test-search-index/${random.uuid}
# As in production, so a test cannot rely on a lazy association loading
# outside a transaction.
spring.jpa.open-in-view=false
