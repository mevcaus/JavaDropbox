# The database: each test context gets an empty PostgreSQL database of its own,
# in a container the whole run shares, which Flyway migrates and Hibernate then
# validates with production's settings. TestDatabaseEnvironment supplies
# spring.datasource.* and those settings, and says why. Docker must be running.
#
# Spring keeps every context it loads, connection pool and all, until the run
# ends, and they all connect to the one server, which allows 100 connections.
# A pool holds ten by default, so a dozen contexts would use them all up; let
# each shrink to one once its tests are done.
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
# Tests that touch files point this at their own temporary directory.
javadropbox.serving.directory=build/test-storage
# A search index for each test context, outside the serving directory: contexts
# that share one would contend for its lock, and a test's temporary directory
# could not be deleted while the indexer was still writing into it.
javadropbox.search.index-directory=build/test-search-index/${random.uuid}
# As in production, so a test cannot rely on a lazy association loading
# outside a transaction.
spring.jpa.open-in-view=false
