<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaDropbox - Dashboard</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="css/dashboard.css" />
</head>

<body>
<header class="header">
    <div class="header-content">
        <h1>📁 JavaDropbox</h1>
        <div class="user-info">
            <span>Welcome, <span id="username">User</span>!</span>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </div>
</header>

<main class="main-content">
    <div class="card">
        <h2>Welcome to JavaDropbox!</h2>
        <p>Your self-hosted file storage solution.</p>
    </div>

    <div class="card">
        <h2>File Browser</h2>

        <div class="path-display">
            <strong>Current Path: </strong>
            <code id="current-path-text">Loading...</code>
        </div>

        <div class="file-browser" id="file-browser-container">
            <p>Loading files...</p>
        </div>
    </div>
</main>

<!-- Link to the external JavaScript file just before the closing body tag -->
<script src="js/dashboard.js"></script>
</body>
</html>
