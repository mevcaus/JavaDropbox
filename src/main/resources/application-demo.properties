# The public demo (SPRING_PROFILES_ACTIVE=demo; see fly.toml and the README's
# "Live demo" section). Anyone can sign in, so the limits keep it from being
# used as free file hosting.

# A shared account whose credentials the sign-in page shows (GET /api/demo), in
# place of the setup flow.
javadropbox.demo.username=demo
javadropbox.demo.password=javadropbox

# Everything is deleted and the sample files stored again once a day, at this
# time in UTC (3 a.m. in Seattle in summer, 2 a.m. in winter).
javadropbox.demo.reset-at=10:00

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# Everything stored, previous versions included.
javadropbox.storage.max-total-size=50MB
javadropbox.versions.max-retained=3
javadropbox.share.max-expiration=15m

# A small machine (512 MB) serving a handful of visitors at a time.
server.tomcat.threads.max=20
spring.datasource.hikari.maximum-pool-size=5
