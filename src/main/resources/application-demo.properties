# The public demo (SPRING_PROFILES_ACTIVE=demo; see fly.toml and the README's
# "Live demo" section). Anyone can sign in, so the limits keep it from being
# used as free file hosting.

# A shared account whose credentials the sign-in page shows (GET /api/demo), in
# place of the setup flow.
javadropbox.demo.username=demo
javadropbox.demo.password=javadropbox

# Everything is deleted and the sample files stored again once a day, at this
# time in UTC (3 a.m. in Seattle in summer, 2 a.m. in winter).
javadropbox.demo.reset-at=10:00

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# What the shared account may store, previous versions included.
javadropbox.demo.quota=50MB
javadropbox.versions.max-retained=3
javadropbox.share.max-expiration=15m

# A small machine (512 MB) serving a handful of visitors at a time.
server.tomcat.threads.max=20
spring.datasource.hikari.maximum-pool-size=5

# Fly suspends the machine after a few idle minutes, and Neon closes its end of
# every connection while it is suspended. A pooled connection that survives
# into the resume is dead, and each one costs the next request a full
# validation timeout to find out. So close idle connections after a minute,
# long before the machine is suspended, and spot any dead one that is left
# within a second.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.validation-timeout=1000

# /actuator/health/liveness, for Fly's health check: whether the app is up,
# without asking the database. /actuator/health does, and Fly calling it every
# 30 seconds would keep a connection busy to be found dead after a suspend.
management.endpoint.health.probes.enabled=true
