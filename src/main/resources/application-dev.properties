# Local development: active under ./gradlew bootRun (see build.gradle).

# The Postgres from compose.yaml, which bootRun starts through Spring Boot's
# Docker Compose support.
spring.datasource.url=jdbc:postgresql://localhost:5432/javadropbox
spring.datasource.username=postgres
spring.datasource.password=password
spring.jpa.show-sql=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# The Vite dev server.
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174
