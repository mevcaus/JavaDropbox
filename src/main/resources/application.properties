spring.application.name=JavaDropBox
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

spring.datasource.url=jdbc:postgresql://localhost:5432/javadropbox
spring.datasource.username=postgres
spring.datasource.password=password
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only
# checks that the entities still match it and refuses to start if they don't.
spring.jpa.hibernate.ddl-auto=validate
# Databases created by the old ddl-auto=update have tables but no Flyway
# history, so stamp them as V1 (the baseline) instead of failing on them.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
logging.level.org.springframework.security=INFO

# Number of previous versions kept per file; older ones are pruned on upload.
javadropbox.versions.max-retained=10

# Signing key for share-link JWTs (HMAC-SHA256, base64-encoded, 256-bit).
# This is a dev-only default checked into source control. Override it with
# the APP_SHARE_JWT_SECRET env var (or app.share.jwt-secret) in any real
# deployment, the same way you would for the DB password above.
app.share.jwt-secret=+mRVZIlDlrnSQTcLyt3WtDhDgkceY5VMzD9D1a5CvyM=
