spring.application.name=JavaDropBox
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB
# Parse an upload only when a controller asks for its parts. Otherwise the
# error page for a refused request (a failed CSRF check, say) parses and spools
# the whole body to disk first.
spring.servlet.multipart.resolve-lazily=true

# Where files are stored, each account's in .users/<id> inside it. Also
# settable as JAVADROPBOX_SERVING_DIRECTORY, with --directory=/path, or as the
# first command-line argument. Created (with a welcome file, which setup gives
# to the first account) if it does not exist.
javadropbox.serving.directory=${user.dir}/JDB

# Where files are stored: local, in the serving directory, or s3, in a bucket in
# S3 or a service with its API, set up by the javadropbox.storage.s3.* settings
# (see docs/self-hosting.md). With s3, the serving directory holds only the app's
# own state, such as the search index.
javadropbox.storage.type=local

# Number of previous versions kept per file (0 or more); older ones are pruned
# on upload.
javadropbox.versions.max-retained=10

# Search covers every name, and the text in text and source files, PDFs and
# Word documents. The text of a file larger than this is not read, so it is
# found by name only; 0 searches names alone. The index is kept in
# .javadropbox/search-index unless javadropbox.search.index-directory says
# otherwise, and can be deleted to have it rebuilt.
javadropbox.search.max-file-size=50MB
# PDFBox warns about every oddity in a PDF it reads, such as a font with no
# Unicode mapping. The indexer reads whatever is uploaded, so only errors count.
logging.level.org.apache.pdfbox=ERROR
logging.level.org.apache.fontbox=ERROR
# Lucene suggests enabling the incubating Vector API, which only vector search
# needs, and this app has none.
logging.level.org.apache.lucene.internal.vectorization=ERROR

# Database. There is deliberately no default: set SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD. ./gradlew bootRun
# runs with the dev profile (application-dev.properties), which points at the
# Postgres in compose.yaml.
#
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only
# checks that the entities still match it and refuses to start if they don't.
spring.jpa.hibernate.ddl-auto=validate
# Databases created by the old ddl-auto=update have tables but no Flyway
# history, so stamp them as V1 (the baseline) instead of failing on them.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Release the database connection when the service call returns, not when the
# response is finished. Otherwise a download holds a pooled connection for as
# long as the client takes to receive it, and a few slow clients exhaust the
# pool.
spring.jpa.open-in-view=false

# Behind a reverse proxy, Tomcat takes the client address, scheme and host
# from X-Forwarded-For/-Proto/-Host, so the login throttle sees the real client
# and share links carry the public https URL. It only believes those headers
# from the proxies listed here (a regex matched against the connecting
# address); from anyone else they are ignored, or a client could pick its own
# address. The default trusts loopback only, for a proxy on the same host. Set
# SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES for a proxy elsewhere, e.g.
# 172\.18\.0\.2 for its address on a Docker network.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1

# The session cookie is not sent on cross-site POSTs (a second line of defence
# behind the CSRF token). It gets the Secure flag on https requests, including
# those a trusted proxy forwards with X-Forwarded-Proto: https.
server.servlet.session.cookie.same-site=lax

# Actuator: /actuator/health is public, for load balancers and the Docker
# healthcheck, and shows only UP or DOWN unless the caller is an admin.
# /actuator/metrics is for admins too (see SecurityConfig). Nothing else is
# exposed: env, beans and the like describe the server, not its health.
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
# Report free space on the disk the files are stored on, not the working
# directory's.
management.health.diskspace.path=${javadropbox.serving.directory}

# The API docs describe every endpoint; only the dev profile publishes them.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Origins allowed to call the API from another origin, comma-separated. The
# built app is served by the backend itself, so production needs none.
app.cors.allowed-origins=
