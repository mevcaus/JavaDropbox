spring.application.name=JavaDropBox
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# Where files are stored. Also settable as JAVADROPBOX_SERVING_DIRECTORY, with
# --directory=/path, or as the first command-line argument. Created (with a
# welcome file) if it does not exist.
javadropbox.serving.directory=${user.dir}/JDB

# Number of previous versions kept per file (0 or more); older ones are pruned
# on upload.
javadropbox.versions.max-retained=10

# Database. There is deliberately no default: set SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD. ./gradlew bootRun
# runs with the dev profile (application-dev.properties), which points at the
# Postgres in compose.yaml.
#
# Flyway owns the schema (src/main/resources/db/migration); Hibernate only
# checks that the entities still match it and refuses to start if they don't.
spring.jpa.hibernate.ddl-auto=validate
# Databases created by the old ddl-auto=update have tables but no Flyway
# history, so stamp them as V1 (the baseline) instead of failing on them.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Behind a reverse proxy, honour X-Forwarded-Proto/Host so share links carry
# the public https URL rather than the proxy's view of the app.
server.forward-headers-strategy=framework

# The API docs describe every endpoint; only the dev profile publishes them.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Origins allowed to call the API from another origin, comma-separated. The
# built app is served by the backend itself, so production needs none.
app.cors.allowed-origins=

# Signing key for share-link JWTs (HMAC-SHA256, base64-encoded, at least 256
# bits). Leave it unset and a random key is generated on first start and kept
# in <serving directory>/.javadropbox/share-jwt.key. Set APP_SHARE_JWT_SECRET
# only to share one key between several instances. Changing or deleting the
# key invalidates every link already handed out.
#app.share.jwt-secret=
