<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaDropbox - Login</title>
    <link rel="stylesheet" th:href="@{/css/Login.css}" />
    <link rel="icon" type="image/png" th:href="@{/JavaDropbox_favicon.png}" />
<!--    <link rel="stylesheet" href="/css/Login.css" />-->
<!--    <link rel="icon" type="image/png" href="/JavaDropbox_favicon.png" />-->
</head>
<body>
<div class="login-container">
    <div class="login-header">
        <img th:src="@{/images/Vertical/JavaDropbox_color_logoAndText_vertical_400px.png}"
             alt="JavaDropbox Logo"/>
    </div>

    <form action="/login" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="remember-me-container">
            <input type="checkbox" id="remember-me" name="remember-me" />
            <label for="remember-me">Remember me for 14 days</label>
        </div>

        <button type="submit" class="login-btn">Sign In</button>
    </form>
</div>
</body>
</html>
