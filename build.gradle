plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.25.0'
	id 'jacoco'
}

group = 'com.javadropbox'
version = '0.0.1-SNAPSHOT'
description = 'JavaDropBox'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	// Ahead of the version the Spring Boot BOM manages (1.21.3), which pins the
	// Docker API to v1.32. Docker Engine 29 raised its minimum to v1.40 and
	// rejects that, so Testcontainers cannot reach the daemon on 29.x hosts.
	set('testcontainersVersion', "1.21.4")
	set('luceneVersion', "10.5.2")
	set('awsSdkVersion', "2.55.3")
	// What the AWS SDK's HTTP client is built against, ahead of the versions the Spring Boot BOM
	// manages (5.5 and 5.3), which it would otherwise be held back to.
	set('httpclient5.version', "5.6.4")
	set('httpcore5.version', "5.4.3")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.flywaydb:flyway-core'
	// Sessions in PostgreSQL, so a restart doesn't sign everyone out.
	implementation 'org.springframework.session:spring-session-jdbc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
	// @Nullable on the API's response fields, which ResponseFieldsConverter puts in the spec.
	implementation 'org.jspecify:jspecify:1.0.0'

	// Search: an index embedded in the app, and the text of PDFs for it.
	implementation "org.apache.lucene:lucene-core:${luceneVersion}"
	implementation "org.apache.lucene:lucene-analysis-common:${luceneVersion}"
	implementation "org.apache.lucene:lucene-highlighter:${luceneVersion}"
	implementation('org.apache.pdfbox:pdfbox:3.0.8') {
		// Spring's spring-jcl already provides the Commons Logging API, routed to Logback.
		exclude group: 'commons-logging', module: 'commons-logging'
	}

	// Storage in S3 or a service compatible with it, as an alternative to the local disk.
	implementation('software.amazon.awssdk:s3') {
		// The asynchronous client's HTTP stack; the store uses the synchronous one.
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
	}
	implementation 'software.amazon.awssdk:apache5-client'

	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.google.jimfs:jimfs:1.3.0'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
		mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
	}
}

// The API spec the frontend's types are generated from. OpenApiSpecTests fails when it no longer
// matches the controllers, and ./gradlew openApiSpec writes it again.
def openApiSpec = file('frontend/openapi.json')

// Shared by test and openApiSpec, so whatever is added here applies to both.
tasks.withType(Test).configureEach {
	useJUnitPlatform()
	systemProperty 'javadropbox.openapi.spec', openApiSpec.absolutePath
	// The assertion's message in the build log, so CI shows why a test failed and not just where.
	testLogging { exceptionFormat = 'full' }
}

tasks.named('test') {
	// Read by OpenApiSpecTests, so a change to it alone runs the tests again.
	inputs.file(openApiSpec).withPathSensitivity(PathSensitivity.NONE)
	// Most of the run is starting Spring contexts one after another, so split the classes across
	// JVMs, one for every two cores: each JVM starts its own PostgreSQL container, which needs the
	// other. The classes that share a serving directory get one per JVM
	// (src/test/resources/config/application.properties). Past four the run gains little more and
	// the machine is busier for it.
	maxParallelForks = Math.min(4, Math.max(1, Runtime.runtime.availableProcessors().intdiv(2)))
}

tasks.register('openApiSpec', Test) {
	description = 'Writes frontend/openapi.json from the controllers. Needs Docker, like the tests.'
	group = 'documentation'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	filter { includeTestsMatching 'com.javadropbox.javadropbox.OpenApiSpecTests' }
	systemProperty 'javadropbox.openapi.update', 'true'
	outputs.upToDateWhen { false }
}

// Coverage of the backend by the tests. ./gradlew check writes the report to
// build/reports/jacoco/test/html and fails when coverage falls below the minimums.
jacoco {
	// Ahead of the version Gradle 8.14 brings (0.8.13). JaCoCo has to read the class files of the
	// Java version the tests run on, so move this up with the toolchain.
	toolVersion = '0.8.16'
}

tasks.named('test') {
	// Only the app's classes, which are all the report reads. The agent otherwise instruments
	// every class of Spring, Hibernate and the rest as the test JVMs load them.
	jacoco.includes = ['com.javadropbox.*', 'db.migration.*']
}

tasks.named('openApiSpec') {
	// Runs one test to write a file, so its coverage means nothing.
	jacoco.enabled = false
}

tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		html.required = true
	}
}

// Just under the coverage when they were set (91.6% of lines, 83.0% of branches), about 20 lines
// and 14 branches of slack, so coverage can't fall more than about half a point. Raise them as
// coverage rises.
tasks.named('jacocoTestCoverageVerification') {
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				minimum = 0.91
			}
			limit {
				counter = 'BRANCH'
				minimum = 0.82
			}
		}
	}
}

tasks.named('check') {
	dependsOn 'jacocoTestReport', 'jacocoTestCoverageVerification'
}

// So the report is there to look at when the minimums fail (CI uploads it either way).
tasks.named('jacocoTestCoverageVerification') {
	mustRunAfter 'jacocoTestReport'
}

// Local runs use the dev profile (application-dev.properties) unless told otherwise.
bootRun {
	environment 'SPRING_PROFILES_ACTIVE', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'dev'
}

// ./gradlew bootJar -PbundleFrontend packs the built frontend (npm run build in
// frontend/) into the jar, so the backend serves the app itself. The Dockerfile
// does this.
tasks.named('processResources') {
	if (project.hasProperty('bundleFrontend')) {
		def dist = file('frontend/dist')
		doFirst {
			if (!new File(dist, 'index.html').exists()) {
				throw new GradleException("No frontend build in ${dist}; run npm run build in frontend/ first")
			}
		}
		from(dist) { into 'static' }
	}
}

spotless {
	java {
		googleJavaFormat('1.22.0')
		target 'src/**/*.java'
	}
}