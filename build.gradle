plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '6.25.0'
}

group = 'com.javadropbox'
version = '0.0.1-SNAPSHOT'
description = 'JavaDropBox'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	// Ahead of the version the Spring Boot BOM manages (1.21.3), which pins the
	// Docker API to v1.32. Docker Engine 29 raised its minimum to v1.40 and
	// rejects that, so Testcontainers cannot reach the daemon on 29.x hosts.
	set('testcontainersVersion', "1.21.4")
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'com.h2database:h2'
	testImplementation 'org.testcontainers:testcontainers'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.testcontainers:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
	imports {
		mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// Local runs use the dev profile (application-dev.properties) unless told otherwise.
bootRun {
	environment 'SPRING_PROFILES_ACTIVE', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'dev'
}

// ./gradlew bootJar -PbundleFrontend packs the built frontend (npm run build in
// frontend/) into the jar, so the backend serves the app itself. The Dockerfile
// does this.
tasks.named('processResources') {
	if (project.hasProperty('bundleFrontend')) {
		def dist = file('frontend/dist')
		doFirst {
			if (!new File(dist, 'index.html').exists()) {
				throw new GradleException("No frontend build in ${dist}; run npm run build in frontend/ first")
			}
		}
		from(dist) { into 'static' }
	}
}

spotless {
	java {
		googleJavaFormat('1.22.0')
		target 'src/**/*.java'
	}
}